<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kinetra</title>

    <link rel="stylesheet" href="assets/css/variables.css">

    <header class="navbar">
