<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Meridian builds connected software for modern businesses."
    >

    <title>Meridian</title>

    <link
        rel="icon"
        href="/assets/icons/favicon.svg"
        type="image/svg+xml"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>
    <div class="site">
        <header class="site-header">
            <div class="container">
                <nav
                    class="navbar"
                    aria-label="Primary navigation"
                >
                    <a
                        class="navbar__brand"
                        href="/"
                        aria-label="Meridian home"
                    >
                        <img
                            class="navbar__logo"
                            src="/assets/icons/meridian.svg"
                            alt=""
                            width="24"
                            height="24"
                        >

                        <span class="navbar__wordmark">
                            Meridian
                        </span>
                    </a>

                    <div class="navbar__desktop">
                        <div class="navbar__links">
                            <a
                                class="navbar__link"
                                href="/products/"
                            >
                                Products
                            </a>

                            <a
                                class="navbar__link"
                                href="/resources/"
                            >
                                Resources
                            </a>

                            <a
                                class="navbar__link"
                                href="/company/"
                            >
                                Company
                            </a>

                            <a
                                class="navbar__link"
                                href="/pricing/"
                            >
                                Pricing
                            </a>

                            <a
                                class="navbar__link"
                                href="https://github.com/YOUR-ORGANIZATION"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                GitHub
                            </a>

                            <a
                                class="navbar__link"
                                href="/contact/"
                            >
                                Contact
                            </a>
                        </div>

                        <span
                            class="navbar__divider"
                            aria-hidden="true"
                        ></span>

                        <div class="navbar__account">
                            <a
                                class="button button--text navbar__login"
                                href="/login/"
                            >
                                Log in
                            </a>

                            <a
                                class="button button--primary button--sm"
                                href="/signup/"
                            >
                                Sign up
                            </a>
                        </div>
                    </div>

                    <div class="navbar__mobile-actions">
                        <a
                            class="navbar__mobile-login"
                            href="/login/"
                        >
                            Log in
                        </a>

                        <a
                            class="button button--primary button--sm"
                            href="/signup/"
                        >
                            Sign up
                        </a>

                        <button
                            class="navbar__menu-button"
                            type="button"
                            aria-label="Open navigation"
                            aria-controls="mobile-navigation"
                            aria-expanded="false"
                        >
                            <span
                                class="navbar__menu-icon"
                                aria-hidden="true"
                            ></span>
                        </button>
                    </div>
                </nav>
            </div>

            <nav
                class="mobile-navigation"
                id="mobile-navigation"
                aria-label="Mobile navigation"
                aria-hidden="true"
            >
                <div class="container mobile-navigation__inner">
                    <a
                        class="mobile-navigation__link"
                        href="/products/"
                    >
                        <span>Products</span>
                        <span aria-hidden="true">→</span>
                    </a>

                    <a
                        class="mobile-navigation__link"
                        href="/resources/"
                    >
                        <span>Resources</span>
                        <span aria-hidden="true">→</span>
                    </a>

                    <a
                        class="mobile-navigation__link"
                        href="/company/"
                    >
                        <span>Company</span>
                        <span aria-hidden="true">→</span>
                    </a>

                    <a
                        class="mobile-navigation__link"
                        href="/pricing/"
                    >
                        <span>Pricing</span>
                        <span aria-hidden="true">→</span>
                    </a>

                    <a
                        class="mobile-navigation__link"
                        href="https://github.com/kinetrahq"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span>GitHub</span>
                        <span aria-hidden="true">↗</span>
                    </a>

                    <a
                        class="mobile-navigation__link"
                        href="/contact/"
                    >
                        <span>Contact</span>
                        <span aria-hidden="true">→</span>
                    </a>
                </div>
            </nav>
        </header>

        <main>
            <!-- Homepage content will go here. -->
        </main>
    </div>

    <script src="/js/navigation.js"></script>
</body>
</html>
